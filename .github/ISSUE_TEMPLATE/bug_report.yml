name: Bug report
description: Something in Hindsight does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! If you can, reproduce the problem with the **Bouncing Balls Demo** sample
        (Package Manager > Hindsight > Samples) or a tiny scene, and say how many objects your scene records.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part?
      options:
        - Recording (objects, velocities, tracked fields)
        - Rewinding (scene, hidden objects, back to live)
        - Timeline and events
        - Selected object panel and graph
        - Scene view (trail, ghosts, overlay)
        - Preferences and shortcuts
        - Performance or memory
        - Other
    validations:
      required: true
  - type: input
    id: unity
    attributes:
      label: Unity Editor version
      placeholder: 6000.3.13f1
    validations:
      required: true
  - type: input
    id: hindsight
    attributes:
      label: Hindsight version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: pipeline
    attributes:
      label: Render pipeline and Enter Play Mode settings
      placeholder: URP, domain reload disabled
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11
  - type: textarea
    id: log
    attributes:
      label: Console output
      description: Errors from the Unity Console, with their stack traces.
      render: text
