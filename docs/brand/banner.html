<html><head><meta charset="utf-8"><title>Hindsight banner</title><style>
:root { --bg:#0e1015; --border:#2c303a; --text:#e6e9ef; --dim:#8b92a2; --accent:#8b7cff; --error:#ff5c5c; --bookmark:#38bdf8; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { width:100%; height:100%; }
body { font-family:'Inter','Segoe UI Variable Display','Segoe UI',system-ui,sans-serif; color:var(--text); overflow:hidden;
  background: radial-gradient(1200px 520px at 78% 30%, rgba(139,124,255,.22), transparent 60%),
              radial-gradient(900px 500px at 10% 110%, rgba(56,189,248,.10), transparent 60%), var(--bg); }
.grid { position:absolute; inset:0; background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
  linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 40px 40px;
  -webkit-mask-image: radial-gradient(ellipse at 60% 40%, #000 30%, transparent 75%); }
.logo { display:flex; align-items:center; gap:22px; }
.mark { width:var(--mark); height:var(--mark); border-radius:calc(var(--mark) * .28); display:grid; place-items:center;
  background: linear-gradient(145deg, #9d90ff, #6a5cf0); box-shadow: 0 12px 40px rgba(139,124,255,.45), inset 0 1px 0 rgba(255,255,255,.35); }
.mark svg { width:58%; height:58%; fill:#fff; }
h1 { font-size:var(--title); font-weight:800; letter-spacing:-.03em; line-height:1; }
.tag { color:#c3c7d4; font-weight:600; }
.sub { color:var(--dim); }
.chips { display:flex; gap:12px; flex-wrap:wrap; }
.chip { padding:9px 16px; border-radius:999px; background:rgba(255,255,255,.05); border:1px solid var(--border); color:#cfd3de; font-weight:600; font-size:18px; }
.chip b { color:var(--accent); }
.tl { position:absolute; border-radius:16px; background:linear-gradient(180deg, #1a1d25, #14161c); border:1px solid var(--border);
  box-shadow: 0 30px 80px rgba(0,0,0,.55); overflow:hidden; }
.tl .ruler { height:30px; border-bottom:1px solid var(--border); position:relative; }
.tl .tick { position:absolute; top:7px; font-size:13px; color:#5f6676; }
.bars { position:absolute; left:14px; right:14px; bottom:12px; height:var(--bars); display:flex; align-items:flex-end; gap:3px; }
.bars i { flex:1; background:rgba(139,124,255,.55); border-radius:2px 2px 0 0; }
.playhead { position:absolute; top:0; bottom:0; width:3px; background:var(--accent); box-shadow:0 0 18px rgba(139,124,255,.9); }
.playhead::before { content:''; position:absolute; top:0; left:-8px; border:9px solid transparent; border-top:11px solid var(--accent); }
.past { position:absolute; top:31px; bottom:0; right:0; background:rgba(139,124,255,.12); }
.label { position:absolute; top:4px; padding:3px 9px; border-radius:6px; background:var(--accent); color:#fff; font-weight:700; font-size:14px; }
.dot { position:absolute; width:16px; height:16px; border-radius:50%; background:var(--error); box-shadow:0 0 14px rgba(255,92,92,.8); }
.dia { position:absolute; width:15px; height:15px; background:var(--bookmark); transform:rotate(45deg); box-shadow:0 0 12px rgba(56,189,248,.8); }
.scene { position:absolute; border-radius:16px; background:#14161c; border:1px solid var(--border); overflow:hidden; box-shadow: 0 30px 80px rgba(0,0,0,.55); }
.floor { position:absolute; height:8px; background:#3a4050; border-radius:3px; }
.ball { position:absolute; border-radius:50%; }
.paddle { position:absolute; height:9px; border-radius:3px; background:#8b7cff; transform:rotate(-18deg); }
.trail { position:absolute; width:4px; background:linear-gradient(180deg, rgba(139,124,255,.15), rgba(139,124,255,1)); border-radius:2px; }

body { --mark:96px; --title:84px; }

.tag { font-size:30px; margin-top:24px; }
.sub { font-size:21px; margin-top:12px; }
</style></head>
